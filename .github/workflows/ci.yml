name: MohallaFlow CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: mohalla-flow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter format, analysis and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Create compile-only Firebase options
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart
      - name: Resolve packages
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Static analysis
        run: flutter analyze --no-pub
      - name: Unit and widget tests
        run: flutter test --no-pub --reporter expanded

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full public history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_VERSION: "8.30.1"

  dependency-audit:
    name: npm dependency audits
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit Cloud Functions dependency lockfile
        run: npm audit --prefix functions --audit-level=moderate
      - name: Audit Firestore QA test dependency lockfile
        run: npm audit --prefix firestore-rules-tests --audit-level=moderate

  osv-scan:
    name: OSV lockfile vulnerability scan
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      scan-args: |-
        --lockfile=./pubspec.lock
        --lockfile=./functions/package-lock.json
        --lockfile=./firestore-rules-tests/package-lock.json
      upload-sarif: false
      fail-on-vuln: true

  payroll-sdk-integration:
    name: Flutter payroll callable SDK integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Create compile-only Firebase options
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart
      - name: Resolve Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Install Cloud Functions dependencies
        run: npm ci --prefix functions
      - name: Install pinned Firebase CLI
        run: npm install --global firebase-tools@15.34.2
      - name: Run Flutter SDK integration on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          script: bash tool/payroll_sdk_integration/run_ci.sh

  functions:
    name: Cloud Functions lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: Install locked dependencies
        run: npm ci --prefix functions
      - name: Syntax / lint check
        run: npm run --prefix functions lint
      - name: Node 22 unit tests
        run: |
          npm run --prefix functions test:resident-registration
          npm run --prefix functions test:app-check
          npm run --prefix functions test:worker-private-migration
